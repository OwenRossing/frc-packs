# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: frc
      POSTGRES_PASSWORD: frc
      POSTGRES_DB: frcpacks
    ports:
      - "5432:5432"
    volumes:
      - frcpacks-db:/var/lib/postgresql/data
volumes:
  frcpacks-db:
