# Local DynamoDB for development and the API tests: docker compose up -d
# Then run the server with DYNAMODB_ENDPOINT=http://localhost:8765 (it makes its table on start).
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory", "-port", "8765"]
    ports:
      - "8765:8765"
