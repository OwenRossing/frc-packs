# Checks that run on every pull request, and before every deploy (deploy.yml calls this file).
# Nothing here touches AWS.
name: ci
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - name: Format
        run: cargo fmt --check
        working-directory: server
      - name: Lint
        run: cargo clippy --all-targets --features lambda -- -D warnings
        working-directory: server
      - name: Tests (against a local DynamoDB)
        working-directory: server
        run: |
          docker run -d -p 8765:8765 amazon/dynamodb-local:latest -jar DynamoDBLocal.jar -sharedDb -inMemory -port 8765
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8765 && break; sleep 1; done
          DYNAMODB_ENDPOINT=http://localhost:8765 AWS_REGION=us-east-1 cargo test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - name: Type-check and build the site
        run: npm run build --workspace=web

  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      # The stacks only look for their asset folders; the real contents are built at deploy time.
      - run: mkdir -p cdk/.build/lambda cdk/.build/site/assets cdk/.build/site/photos cdk/.build/site/packs
      - name: Check the CDK stacks
        run: npm run cdk:test
